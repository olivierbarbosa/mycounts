# Service des fichiers compilés du front.
#
# Ce serveur ne connaît PAS l'API : c'est Traefik qui envoie /api et /health vers le
# conteneur d'API, sur la même origine. Dupliquer ce routage ici créerait une seconde
# source de vérité, exactement la faute que vite.config.ts documente (ERREURS.md #015).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute route inconnue rend index.html, et c'est le
    # routeur côté navigateur qui décide. Sans cela, un rechargement sur /operations
    # renverrait 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par Vite portent une empreinte dans leur nom : ils sont
    # immuables, on peut les garder longtemps. index.html, lui, ne doit JAMAIS être mis
    # en cache, sinon un déploiement reste invisible derrière un ancien HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
