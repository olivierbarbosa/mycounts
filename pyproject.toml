[project]
name = "mycounts"
version = "0.0.0"
description = "Gestion de budget de foyer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    # Envoi de fichiers : requis par FastAPI pour lire un formulaire multipart, c'est-à-dire
    # pour l'import de relevé. Sans lui, la route lève à l'exécution et non au démarrage.
    "python-multipart>=0.0.20",
    # Avatars : décodage, recadrage et réencodage. Aucune image reçue n'est stockée telle
    # quelle — un fichier téléversé est une donnée non fiable, et le réencoder est ce qui
    # garantit qu'on sert bien une image et non ce qu'elle prétendait être.
    "pillow>=11.0",
    # Second facteur. `pyotp` implémente la RFC 6238 : l'écrire soi-même exposerait à des
    # fautes silencieuses — fenêtre de tolérance, comparaison non constante — qu'aucun
    # test fonctionnel ne révélerait.
    "pyotp>=2.9",
    # Le QR d'enrôlement, rendu en SVG côté serveur. Pas d'image : un SVG reste net à
    # toute taille et ne dépend pas de Pillow pour cet usage.
    "qrcode>=8.0",
    # Client HTTP de `categorisation_ia.py`, importé au CHARGEMENT du module : sans lui
    # l'API ne démarre pas du tout, même quand la clé OpenRouter est absente. Il était
    # déclaré en dépendance de développement, ce qui ne se voyait ni en local ni en CI —
    # les deux installent `.[dev]`. Seule une installation de production le révélait.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    # Stubs de typage : `qrcode` n'en fournit pas, et mypy est en mode strict.
    "types-qrcode>=8.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "scripts", "tests"]
# Un `# type: ignore` nu est refusé : le garde-fou n°5 exige une justification écrite.
enable_error_code = ["ignore-without-code", "redundant-expr"]
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations : fichiers produits par « alembic revision --autogenerate ». Les reformater
# à la main les ferait diverger de ce que l'outil régénère, pour un gain nul.
"backend/migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
