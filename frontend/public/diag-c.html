<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>C — manifest standalone SANS meta apple</title>
<link rel="manifest" href="/diag-c.webmanifest" />
<style>
  html, body, #racine { height: 100%; }
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  #racine { padding: 60px 16px 0; box-sizing: border-box; }
  pre { white-space: pre-wrap; font-size: 13px; }
  .sonde { position: fixed; left: 0; right: 0; bottom: 0; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); background: rgba(14,165,233,.35); }
  .barre { position: fixed; left: 24px; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); height: 56px; border-radius: 28px; background: rgba(51,65,85,.9); display: flex; align-items: center; justify-content: center; }
  .bord { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; background: #f43f5e; }
  .fond { position: fixed; inset: 0; z-index: -1; background: linear-gradient(#0f172a, #0f172a 50%, #1e293b 50%); }
</style>
</head>
<body>
<div class="fond"></div>
<div id="racine"><h2>C — manifest standalone SANS meta apple</h2><pre id="sortie">mesure…</pre></div>
<div class="sonde"></div>
<div class="barre">barre témoin (bottom = 24px + safe-area)</div>
<div class="bord"></div>
<script>
function mesurer() {
  const vv = window.visualViewport;
  const barre = document.querySelector('.barre').getBoundingClientRect();
  const sonde = getComputedStyle(document.querySelector('.sonde')).paddingBottom;
  const racine = document.getElementById('racine').getBoundingClientRect();
  const lignes = {
    'navigator.standalone': navigator.standalone,
    'display-mode': ['fullscreen','standalone','minimal-ui','browser'].filter(m => matchMedia(`(display-mode: ${m})`).matches).join(',') || 'aucun',
    'screen.width x height': screen.width + ' x ' + screen.height,
    'innerWidth x innerHeight': innerWidth + ' x ' + innerHeight,
    'outerHeight': outerHeight,
    'documentElement.clientHeight': document.documentElement.clientHeight,
    'body.clientHeight': document.body.clientHeight,
    '#racine height (100%)': Math.round(racine.height),
    'visualViewport height / offsetTop / scale': vv ? Math.round(vv.height) + ' / ' + vv.offsetTop + ' / ' + vv.scale : 'absent',
    'safe-area-inset-bottom': sonde,
    'barre.bottom (px depuis le haut)': Math.round(barre.bottom),
    'écart barre → bas du viewport': Math.round(innerHeight - barre.bottom),
    'devicePixelRatio': devicePixelRatio,
    'user agent': navigator.userAgent,
  };
  document.getElementById('sortie').textContent = Object.entries(lignes).map(([k, v]) => k + ' : ' + v).join('\n');
}
mesurer(); addEventListener('resize', mesurer); visualViewport && visualViewport.addEventListener('resize', mesurer);
</script>
</body>
</html>
