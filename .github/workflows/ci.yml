name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mycounts
          POSTGRES_PASSWORD: mycounts
          POSTGRES_DB: mycounts
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mycounts"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      MYCOUNTS_DATABASE_URL: postgresql+psycopg://mycounts:mycounts@localhost:5434/mycounts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # La liste des contrôles vit dans le Makefile et NULLE PART ailleurs. Recopier ici
      # « ruff puis mypy puis les garde-fous » ferait diverger CI et poste local, et l'un
      # des deux finirait par mentir.
      - name: Installer
        run: make installer

      - name: Vérifier (lint, types, garde-fous, tests)
        run: make verifier

      # Les tests d'intégration touchent des tables : elles doivent exister. Cette étape
      # manquait, et la CI a rougi — c'est exactement son rôle, mon poste local ayant un
      # état que le dépôt ne reproduisait pas. Voir ERREURS.md #006.
      - name: Appliquer les migrations
        run: make migrer

      - name: Tests d'intégration (PostgreSQL réel)
        run: make tests-integration

      - name: Installer le frontend
        run: make front-installer

      - name: Types du frontend
        run: make front-lint

      - name: Tests unitaires du frontend
        run: make front-tests

      # Mise en page sur 390 / 820 / 1280 px dans un vrai navigateur. Playwright démarre
      # lui-même uvicorn et Vite : aucun processus n'est lancé à la main.
      - name: Tests de bout en bout (navigateur réel)
        run: make tests-e2e
